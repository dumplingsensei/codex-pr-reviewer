# Recurring maintenance this repository actually has:
# the action pins in .github/workflows/, and the production/build dependencies
# under tooling/cross-model-advisor. Dependabot turns both into pull requests,
# which is the difference between maintenance that is rare and maintenance that
# is a surprise.
#
# Monthly, because majors are infrequent and a weekly check would open nothing
# most weeks.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/tooling/cross-model-advisor"
    schedule:
      interval: "monthly"
