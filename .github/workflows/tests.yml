name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo for the integration suite"
        default: "cli/cli"
      pr:
        description: "pull request number for the integration suite"
        default: "13899"
  schedule:
    # The integration suite is the only thing that proves the worktree diff is
    # GitHub's diff, and it needs the network. Weekly, so that assertion does
    # not depend on someone remembering to run it.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  offline:
    # unit + regression need no network, no GitHub account, and never touch the
    # real cache, so they gate every push. The matrix covers the documented
    # floor (Node 18) and the platform the plugin is developed on.
    name: offline · node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["18", "22"]
    steps:
      # Pinned to commit SHAs, not tags. A major tag is mutable: whoever can
      # move `v7` can change what runs here, and this workflow has a token. The
      # trailing comment is what Dependabot reads and rewrites, so updates still
      # arrive as pull requests — the pin costs nothing in maintenance and
      # removes the trust.
      #
      # setup-node's automatic package-manager caching, added in v5, stays inert
      # here because the repo has no package.json — adding one switches it on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version guard below diffs against a base commit, which a
          # depth-1 checkout does not have.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Pure helpers, plus the release stamps that keep four version literals in
      # step. A stamp left behind at release time silently disables the only
      # signal a session gets that its prompts are older than the plugin.
      - run: node tests/unit.mjs
      # Every case here is a defect that shipped once, driven against synthetic
      # repositories and a stub `codex` in an isolated XDG_CACHE_HOME.
      - run: ./tests/regression.sh
      # Once per run, not once per matrix leg: it reads git history, which does
      # not vary by platform or Node version.
      - name: Shipped content moved the version
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: ./tests/version-guard.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      # The manifests decide whether this installs at all, and nothing else here
      # reads them the way Claude Code does. One leg only: the answer does not
      # vary by platform or Node version, and this is the step that costs a
      # package install.
      - name: Plugin manifests validate
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        # Pinned, for the same reason the actions above are. `latest` published
        # twelve times in the ten days before this pin went in, so an unpinned
        # install meant every run validated against a different tool — and
        # `--strict` fails on "unrecognized fields, missing metadata, and other
        # issues that the runtime tolerates", which is exactly the kind of rule
        # that moves between releases. A gate that can turn red for reasons
        # absent from the diff is the failure this repository already refuses
        # everywhere else: it reads as the pull request's fault rather than the
        # toolchain's. The scheduled job below is what watches `latest`.
        env:
          CLAUDE_CODE_VERSION: 2.1.241
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" >/dev/null
          claude plugin validate --strict .
          claude plugin validate --strict plugins/codex-pr-reviewer

  packaging-drift:
    # The other half of pinning the validator: something still has to notice
    # when a newer Claude Code stops accepting these manifests. Pinning alone
    # would mean validating for ever against rules the ecosystem has moved on
    # from — which fails in the direction that reaches users, rather than CI.
    #
    # Dependabot cannot carry this one: it is configured for github-actions
    # only, and a version inside a `run:` block is not a dependency it tracks.
    # So this job is the mechanism that says the pin has gone stale.
    name: packaging · latest claude code
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Validate against the current release
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null
          echo "validating with $(claude --version)"
          claude plugin validate --strict .
          claude plugin validate --strict plugins/codex-pr-reviewer

  integration:
    # Real git and gh against a public PR; never invokes Codex. Scheduled and
    # manual only: it depends on the network and on an upstream PR still being
    # there, and neither of those should be able to block a commit.
    name: integration · real git and gh
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Put the shared Codex stub on PATH
        # This suite never invokes Codex — it asserts that what Codex would be
        # handed is byte-for-byte GitHub's diff. `codex` is needed only because
        # the suite gates on `doctor`, which refuses an unhealthy toolchain and
        # would otherwise turn every CI run into a silent SKIP.
        #
        # The stub is tests/stubs/codex, the same file the regression suite
        # uses. It used to be written out here as well, in a second language the
        # regression suite cannot see, so a new preflight probe could pass every
        # local test and fail this job with "toolchain unhealthy" — which reads
        # as broken CI rather than a stale stub. tests/unit.mjs now fails if
        # this step stops referring to the shared copy.
        run: echo "$GITHUB_WORKSPACE/tests/stubs" >>"$GITHUB_PATH"
      - name: Integration suite
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this a preflight skip exits 0, and the only job that
          # exercises real git and gh would pass without asserting anything.
          CPR_REQUIRE_TOOLCHAIN: "1"
        run: |
          ./tests/integration.sh \
            "${{ github.event.inputs.repo || 'cli/cli' }}" \
            "${{ github.event.inputs.pr || '13899' }}"
