name: codeql

# Advanced setup instead of GitHub's default setup, which cannot exclude paths.
# plugins/cross-model-advisor/dist is esbuild output bundling third-party SDKs
# (pi-ai, google-auth-library, @google/genai); scanning it reports those
# vendors' provider-detection code, not ours. The plugin's own source under
# src/ is still analysed, and the bundle is rebuilt and diffed against it in
# tests.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze · ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      # Pinned to commit SHAs; see tests.yml for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - plugins/cross-model-advisor/dist
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
